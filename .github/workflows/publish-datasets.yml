name: Publish public datasets

# Publishes the currently-committed reference datasets (brand-domain list,
# malware/spam blocklists) to GitHub Pages so installed extensions can pick
# up a fix without waiting for a new Chrome Web Store release -- see
# src/lib/remoteDataset.ts and docs/privacy.md.
#
# This workflow only publishes what's committed. "Refresh lists"
# (refresh-datasets.yml) refreshes the lists every Monday before this runs,
# and commits them only when scripts/dataset-guard.mjs passes.
on:
  schedule:
    - cron: "17 6 * * 1" # every Monday, 06:17 UTC -- an arbitrary off-peak time
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the published dataset directory
        run: |
          mkdir -p dist-pages
          cp src/lib/data/brandDomains.json dist-pages/brandDomains.json
          jq '.domains' src/lib/data/malwareDomains.generated.json > dist-pages/malwareDomains.json
          jq '.domains' src/lib/data/spamDomains.generated.json > dist-pages/spamDomains.json
          jq '.domains' src/lib/data/phishingHosts.generated.json > dist-pages/phishingHosts.json
          # When each list was built, for Settings' "Lists updated" row (listDates.ts).
          jq -n --slurpfile s src/lib/data/spamDomains.generated.json --slurpfile m src/lib/data/malwareDomains.generated.json --slurpfile b public/data/brand-registry.json             '{spam: $s[0].generatedAt, malware: $m[0].generatedAt, brands: $b[0].generatedAt}' > dist-pages/listDates.json

      # Ed25519 signature beside each file (<file>.sig). The extension takes
      # the brand allow-list only when it verifies, and the block lists too
      # once DATASET_PUBLIC_KEY is set. See scripts/sign-datasets.mjs.
      - name: Sign the datasets
        env:
          CLUSTER_DATASET_SIGNING_KEY: ${{ secrets.CLUSTER_DATASET_SIGNING_KEY }}
        run: node scripts/sign-datasets.mjs dist-pages

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
      - uses: actions/deploy-pages@v5
        id: deployment
