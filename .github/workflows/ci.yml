name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Runtime deps only — the built extension ships no node_modules, so a
      # dev/build-tool advisory can't reach a user. Fails on a real one.
      - run: npm audit --omit=dev --audit-level=high
