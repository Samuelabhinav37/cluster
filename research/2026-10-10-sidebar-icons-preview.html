<title>Cluster Sidebar Icons</title>
<style>
/* Layout: the real-size Cluster sidebar beside a quiet page, in light and dark. One small motion per icon on hover. */
:root {
  --bg: #f5f5f7;
  --side: #ffffff;
  --line: #e3e3e8;
  --hover: #f0f0f3;
  --active: #e8e8ed;
  --fg: #1d1d1f;
  --fg-2: #48484d;
  --fg-3: #6e6e73;
  --accent: #3563c7;
  --danger: #c43b3b;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0a0a0c; --side: #141416; --line: #262629; --hover: #1f1f22; --active: #2a2a2e; --fg: #f5f5f7; --fg-2: #d1d1d6; --fg-3: #98989f; --accent: #6f9be0; --danger: #fa6d6d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0a0a0c; --side: #141416; --line: #262629; --hover: #1f1f22; --active: #2a2a2e; --fg: #f5f5f7; --fg-2: #d1d1d6; --fg-3: #98989f; --accent: #6f9be0; --danger: #fa6d6d; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { padding-inline: 16px; padding-block: 24px 40px; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.top h1 { margin: 0; font: 600 18px/1.2 var(--display); letter-spacing: -0.02em; }
.top p { margin: 0; color: var(--fg-3); font-size: 13.5px; flex: 1 1 280px; min-width: 0; }
.seg { display: flex; gap: 4px; background: var(--side); border-radius: 980px; padding: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { border: 0; background: transparent; border-radius: 980px; padding: 6px 12px; font: 500 13px var(--font); color: var(--fg-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.frame { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 560px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.08); background: var(--bg); }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 18px; font: 600 17px/1 var(--display); letter-spacing: -0.02em; }
.brand .mk { width: 28px; height: 28px; border-radius: 8px; background: var(--fg); color: var(--side); display: grid; place-items: center; }
.brand .mk svg { width: 18px; height: 18px; }
.item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--fg-2); font: 500 14.5px/1 var(--font); letter-spacing: -0.01em; cursor: pointer; text-align: left; width: 100%; transition: background .15s, color .15s; }
.item:hover { background: var(--hover); color: var(--fg); }
.item.on { background: var(--active); color: var(--fg); font-weight: 600; }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.item .n { margin-left: auto; font-size: 12.5px; color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.item .n.red { color: var(--danger); font-weight: 600; }
.ico { width: 22px; height: 22px; flex: none; overflow: visible; }
.ico * { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; }
.item.on .ico { color: var(--accent); }
.sep { height: 1px; background: var(--line); margin: 10px 10px; }
.grow { flex: 1; }

/* One simple motion each. Plays on hover or keyboard focus, then settles. */
.ico .p { transition: transform .38s var(--spring); }
.item:is(:hover, :focus-visible) .home .door { transform: scaleX(.35); transform-origin: left center; }
.item:is(:hover, :focus-visible) .bin .lid { transform: translateY(-2px) rotate(-14deg); transform-origin: left bottom; }
.item:is(:hover, :focus-visible) .tray .env { transform: translateY(3px); }
.tray .env { transform: translateY(-1px); }
.item:is(:hover, :focus-visible) .layers .l1 { transform: translateY(-2.5px); }
.item:is(:hover, :focus-visible) .layers .l3 { transform: translateY(2px); }
.shield .tick { stroke-dasharray: 12; stroke-dashoffset: 0; transition: stroke-dashoffset .45s ease; }
.item:is(:hover, :focus-visible) .shield .tick { animation: draw .5s ease both; }
@keyframes draw { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }
.clock .hand { transform-box: view-box; transform-origin: 12px 12px; transition: transform .7s cubic-bezier(.4, 0, .2, 1); }
.item:is(:hover, :focus-visible) .clock .hand { transform: rotate(360deg); }
.item:is(:hover, :focus-visible) .gear .g { transform: rotate(60deg); transform-origin: center; }
.item:is(:hover, :focus-visible) .mag .g { transform: rotate(-14deg); transform-origin: 40% 40%; }

/* Page beside the sidebar */
.main { padding: 32px 36px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.main h2 { margin: 0; font: 600 34px/1.06 var(--display); letter-spacing: -0.03em; }
.main p { margin: 0; color: var(--fg-3); font-size: 16px; font-weight: 500; max-width: 46ch; }
.ph { height: 64px; border-radius: 16px; background: var(--side); box-shadow: inset 0 0 0 1px var(--line); }
.ph.s { width: 70%; }
.note { font-size: 13px; color: var(--fg-3); margin: 0; }

@media (max-width: 680px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 24px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .ico .p, .ico * { transition: none !important; animation: none !important; }
}
</style>

<div class="wrap">
  <div class="top">
    <h1>Cluster sidebar</h1>
    <p>Hover each item, or tab through with the keyboard. One small motion per icon, then it settles. Motion turns off when the system asks for reduced motion.</p>
    <div class="seg" role="group" aria-label="Theme">
      <button data-t="" aria-pressed="true">System</button>
      <button data-t="light" aria-pressed="false">Light</button>
      <button data-t="dark" aria-pressed="false">Dark</button>
    </div>
  </div>

  <div class="frame">
    <nav class="side" aria-label="Sections">
      <div class="brand"><span class="mk"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M 110.68,26 Q 128,16 145.32,26 L 207.67,62 Q 224.99,72 224.99,92 L 224.99,164 Q 224.99,184 207.67,194 L 145.32,230 Q 128,240 110.68,230 L 48.33,194 Q 31.01,184 31.01,164 L 31.01,92 Q 31.01,72 48.33,62 Z M 81 88 h 94 a 12 12 0 0 1 12 12 v 56 a 12 12 0 0 1 -12 12 h -94 a 12 12 0 0 1 -12 -12 v -56 a 12 12 0 0 1 12 -12 Z M 75 96 L 128 129.6 L 181 96 L 181 82 L 75 82 Z" fill="currentColor" fill-rule="evenodd"/></svg></span>Cluster</div>

      <button class="item on" data-title="Home" data-sub="What needs you today.">
        <svg class="ico home" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.2 12 4l8 6.2V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path class="p door" d="M10 20v-5.2h4V20"/></svg>
        Home
      </button>
      <button class="item" data-title="Clear out" data-sub="Mail you can get rid of in one go.">
        <svg class="ico bin" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8.5 7.4 19a1.2 1.2 0 0 0 1.2 1.1h6.8a1.2 1.2 0 0 0 1.2-1.1l.9-10.5"/><g class="p lid"><path d="M4.5 6.5h15"/><path d="M9.5 6.5V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.5"/></g></svg>
        Clear out <span class="n">412</span>
      </button>
      <button class="item" data-title="Senders" data-sub="Everyone who emails you.">
        <svg class="ico tray" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 13.5h4.2l1.4 2.4h5.8l1.4-2.4h4.2"/><path d="M5.6 7 3.5 13.5V19a1 1 0 0 0 1 1h15a1 1 0 0 0 1-1v-5.5L18.4 7"/><g class="p env"><rect x="8.5" y="3.5" width="7" height="5.2" rx=".8"/><path d="M8.8 4l3.2 2.3L15.2 4"/></g></svg>
        Senders
      </button>
      <button class="item" data-title="Sorting" data-sub="Where each kind of mail goes.">
        <svg class="ico layers" viewBox="0 0 24 24" aria-hidden="true"><path class="p l1" d="M12 4 4 8.5 12 13l8-4.5Z"/><path class="p l2" d="M4 12.5 12 17l8-4.5"/><path class="p l3" d="M4 16.5 12 21l8-4.5"/></svg>
        Sorting
      </button>
      <button class="item" data-title="Safety" data-sub="Emails that look like scams.">
        <svg class="ico shield" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 5 6v5.4c0 4 2.8 7.3 7 9.1 4.2-1.8 7-5.1 7-9.1V6z"/><path class="tick" d="M9 12.2l2.1 2.1L15.2 10"/></svg>
        Safety <span class="n red">2</span>
      </button>

      <span class="grow"></span>
      <div class="sep"></div>
      <button class="item" data-title="Search" data-sub="Find a sender or a setting.">
        <svg class="ico mag" viewBox="0 0 24 24" aria-hidden="true"><g class="p g"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></g></svg>
        Search
      </button>
      <button class="item" data-title="Activity" data-sub="Everything Cluster did, with Undo.">
        <svg class="ico clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path class="p hand" d="M12 12V7.5"/><path d="M12 12l3 2"/></svg>
        Activity
      </button>
      <button class="item" data-title="Settings" data-sub="Accounts, appearance and more.">
        <svg class="ico gear" viewBox="0 0 24 24" aria-hidden="true"><g class="p g"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/></g></svg>
        Settings
      </button>
    </nav>
    <main class="main">
      <h2 id="pt">Home</h2>
      <p id="ps">What needs you today.</p>
      <div class="ph"></div>
      <div class="ph"></div>
      <div class="ph s"></div>
      <p class="note">Placeholder page. This preview is only about the sidebar and its icons.</p>
    </main>
  </div>
</div>

<script>
(function () {
  const items = document.querySelectorAll(".item");
  items.forEach((b) => b.addEventListener("click", () => {
    items.forEach((x) => x.classList.toggle("on", x === b));
    document.getElementById("pt").textContent = b.dataset.title;
    document.getElementById("ps").textContent = b.dataset.sub;
  }));
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    if (b.dataset.t) document.documentElement.setAttribute("data-theme", b.dataset.t);
    else document.documentElement.removeAttribute("data-theme");
  }));
})();
</script>
